# celia.toml — bella's celia manifest, replacing scripts/vhs/scenes.toml.
#
# CE.1.D task 2: a TRANSLATION of scripts/vhs/scenes.toml, field by field.
# Every name, key sequence, dimension pair, settle override and min_bytes
# below is copied verbatim from that file — none of it is re-derived or
# "improved". Do not hand-tune a value here without re-deriving it from a
# verified-good capture the way scenes.toml's own comments describe.
#
# KNOWN GAP, NOT SILENTLY WORKED AROUND (found authoring this file,
# 2026-09-07): celia's `Scene` (crates/celia-core/src/manifest.rs) has no
# per-scene override of `[target]` — `program`/`args`/`cwd` are one value
# for the WHOLE manifest, resolved once in `driver.rs::run_scene` as
# `&manifest.target`. bella's own scenes.toml drives the SAME binary at SIX
# distinct positional targets across these 19 scenes (`scripts/vhs/fixtures/
# demo.md`, `README.md`, `.`, `scripts/vhs/fixtures/reveal_demo`,
# `scripts/vhs/fixtures/symlink_demo/linked`,
# `scripts/vhs/fixtures/scroll_anchor.md`) — celia's schema cannot express
# that with one `[target]` table, exactly the same shape of gap task 1 found
# and fixed for per-scene terminal dimensions (`width`/`height` on `Scene`).
# This is CE.1.D task 2's own acceptance criteria (AC1) deliberately does
# NOT list "target" among the fields this file must match verbatim — only
# name, key sequence, dimensions, settle override and min_bytes, which is
# exactly celia's current per-scene field set. The `# target:` comment on
# each `[[scene]]` below preserves bella's original value losslessly so a
# follow-up prerequisite task (a `Scene::program`/`Scene::args` override,
# same `Option<T>`-inherits-the-manifest-default shape as `width`/`height`)
# can wire it up without re-deriving anything. Until that lands, `celia
# check` against this manifest (CE.1.D task 3) will mismatch every scene
# whose target differs from `[target]` below.
#
# SECOND GAP, also carried forward verbatim rather than papered over: the
# `narrow_scroll_anchor_after_resize` scene's last key is the literal
# `RESIZE:30x10` pseudo-key. bella's own `capture_scenes.sh` special-cased
# this token as a live `tmux resize-window` (never sent to the app) — the
# only way that manifest can exercise the real `Event::Resize` path bella's
# scroll anchoring reacts to. celia's `driver.rs::send_key_argv` has no
# such special case: a token longer than one character is sent as a literal
# tmux named-key argument, so `RESIZE:30x10` would be forwarded to `tmux
# send-keys` as an (invalid) key name today. Kept verbatim per this task's
# "do not re-derive the key sequence" rule; task 3's `celia check` run is
# where this will surface.

golden_dir = "tests/scenes"

[target]
# No per-scene override exists yet (see the gap above) — this is bella's
# release binary with no fixed positional argument, matching
# capture_scenes.sh's own `BINARY="$REPO_ROOT/target/release/bella"`. Each
# scene's actual bella invocation argument is recorded verbatim in that
# scene's `# target:` comment below.
program = "./target/release/bella"
args = []
cwd = "."

[settle]
# scenes.toml's [defaults] table, carried verbatim.
launch_settle = 2.0
key_settle = 0.4

