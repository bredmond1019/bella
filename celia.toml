# --- related: rows (BE.7.G task 4) ----------------------------------------
#
# A single scene shows all THREE display states at once, per
# `related_demo.md`'s own doc comment: `related:` carries one doc_id
# claimed by exactly one document (Resolved), one claimed by none
# (Unresolved), and one claimed by two (Ambiguous) — the same shape as
# `ui.rs`'s
# `metadata_pane_related_rows_render_resolved_unresolved_and_ambiguous_distinctly`
# golden test. One scene rather than three: each scene launch pays the
# SAME real, whole-fleet doc_id index build BE.7.G task 2 measured at
# ~43s on this machine (`resolve_corpus_root` walks up to this fleet's
# `brain.toml`, not `core/bella` alone), so three separate scenes would
# only triple that cost for no extra visual coverage — the one screenshot
# already carries all three states legibly, exactly like the golden test
# it mirrors.
#
# `settle = 60.0` overrides the manifest's 0.4s default for BOTH the
# sleep after the "t" key AND the driver's own post-loop settle (celia's
# `TmuxDriver::run_scene` sleeps `settle` after every key AND once more
# before capture) — 120s total, comfortably past the ~43s measured build
# time even under load. This is a deliberate outlier next to this
# manifest's other per-scene overrides (0.5s, 0.6s above); it exists
# because celia's text tier has no readiness-wait primitive
# (unlike the image tier's `Wait+Screen`, see reference-wide.tape's
# matching scene) — a fixed sleep is the only tool available, so it must
# outlast the real build rather than approximate it.
[[scene]]
# target: scripts/vhs/fixtures/related_corpus/related_demo.md
name = "wide_reader_related_states"
args = ["scripts/vhs/fixtures/related_corpus/related_demo.md"]
keys = ["t"]
settle = 60.0
width = 110
height = 43
min_bytes = 30000
tape = "scripts/vhs/reference-wide.tape"

# --- Tree pane (BE.7.H task 4) --------------------------------------------
#
# New scenes, not a translation from scenes.toml — BE.7.H task 4 owes
# coverage of the corpus tree pane (BE.7.H task 2: the rail's third
# stacked section, next to Contents/Metadata) expanded one level, and of
# the root-jail refusal that pane's `..` row hits unconditionally (its
# `dir` is always constructed equal to `root_boundary`, wired from the
# invoked path by `main.rs` per BE.7.H task 2). Both launch on demo.md
# (already this manifest's default reader fixture) so the tree is the
# only new thing on screen, then: "t" opens the rail (its three sections,
# including "Tree", paint together), "T" gives the rail keyboard focus
# (lands on whichever section was last focused, which for a fresh launch
# is always Contents), and two "Tab"s cycle Contents -> Metadata -> Tree
# per `RailSection::next` — landing on Tree with `rail_selected` reset to
# its first row, the tree's own `..` (`BrowserEntryKind::ParentDir`).
#
# The tree is always rooted at `App::corpus_root`
# (`bella_engine::browser::resolve_corpus_root`), which for any path
# under this fleet checkout resolves to the nearest ancestor `brain.toml`
# — the HQ root, not `core/bella` alone (the same resolution
# `wide_reader_related_states` above documents) — so the tree's listing
# is the fleet root's own tracked, non-hidden directories, dirs before
# markdown files, alphabetized case-insensitively. `_planning` is first:
# a leading `_` (0x5F) sorts before every lowercase letter once
# lowercased, so it precedes `business`, `client`, `core`, `docs`, and
# every other top-level dir. One further `Down` selects it; `Enter`
# expands it in place.

[[scene]]
# target: scripts/vhs/fixtures/demo.md
#
# ABSOLUTE path via shell `$(pwd)` expansion, deliberately, not the
# relative form every other scene above uses. `bella_engine::browser::
# resolve_corpus_root` walks `Path::parent()` up from the invoked path to
# find the fleet's `brain.toml` — and `Path::parent()` on a RELATIVE path
# stops at `""` (no more components) without ever reaching the real
# filesystem root, so it can climb only as far as the relative string
# itself already spells out. `scripts/vhs/fixtures/demo.md` never spells
# out `agentic-portfolio/`, so the walk gives up short of it and the Tree
# pane's corpus root resolves wrong (empty listing) — reproduced live via
# `tmux send-keys`, both with a relative arg (empty Tree) and with this
# `$(pwd)/...` arg (correctly populated). TmuxDriver types this scene's
# `args` into a REAL shell in the tmux pane (`send-keys -l`, not an execve
# argv) — see `driver::launch_command_argv` — so `$(pwd)` expands there
# exactly as it would at an interactive prompt, to whatever machine- and
# checkout-specific absolute path this repo lives at. This is a scene-level
# workaround, not a fix: `resolve_corpus_root` itself still cannot climb
# above a relative invocation, which is a `bella-engine`/`browser.rs`
# defect outside this task's files — not addressed here.
name = "wide_tree_expanded_one_level"
args = ["$(pwd)/scripts/vhs/fixtures/demo.md"]
keys = ["t", "T", "Tab", "Tab", "Down", "Enter"]
width = 110
height = 43
min_bytes = 90000
tape = "scripts/vhs/reference-wide.tape"

[[scene]]
# target: scripts/vhs/fixtures/demo.md
# No Down before Enter: `rail_selected` lands on row 0, the tree's own
# `..` row, once Tree gains focus — `Enter` there goes through
# `Browser::ascend_target`, which is `None` unconditionally for the tree
# (its `dir` is always its own `root_boundary`), so this is the
# root-jail refusal, not a real ascend.
#
# Same `$(pwd)` absolute-path workaround as the scene above, and for the
# identical reason (relative-path corpus-root resolution) — see that
# scene's comment.
name = "wide_tree_root_jail_refusal"
args = ["$(pwd)/scripts/vhs/fixtures/demo.md"]
keys = ["t", "T", "Tab", "Tab", "Enter"]
width = 110
height = 43
min_bytes = 90000
tape = "scripts/vhs/reference-wide.tape"

# --- The image tier: bella's existing VHS tapes -------------------------
#
# output_dir is carried verbatim from the tapes' own `Screenshot` lines
# (reference-wide.tape, reference-narrow.tape, reference-collapse.tape all
# write to planning/artifacts/screenshots/<scene>.png) — the tapes are not
# modified by this task, so this must match what they already do, even
# though celia's own docs advise against a vault-symlink path for a
# consumer's OWN golden output. This is bella's pre-existing setup, not a
# regression introduced by this migration.
[image]
output_dir = "planning/artifacts/screenshots"
render_source_paths = [
  "crates/bella/src/ui.rs",
  "crates/bella-engine/src/markdown.rs",
  "crates/bella-engine/src/theme.rs",
  "crates/bella-engine/src/palette.rs",
]
# CE.ticket.freshness-by-source-content (celia 9de43cb, wired here 2026-09-08):
# freshness is now content-addressed, not time-addressed. celia records a hash
# of the render_source_paths SET at capture time into the manifest below and
# compares against that, instead of asking git whether the PNG's commit time is
# newer than the source's.
#
# WHY THE CHANGE WAS NEEDED, since the old behaviour looked reasonable: a
# re-capture producing BYTE-IDENTICAL output cannot be committed (git records no
# path without a content change), so its commit time never advanced and the
# scene stayed STALE forever. Measured in BE.7.K: 6 of 23 scenes permanently
# stale after a ui.rs change that genuinely did not alter their rendering.
# The predecessor design (filesystem mtime) failed the opposite way -- mtime is
# not preserved across clone, so that gate could never go RED.
#
# COMMIT THIS FILE. It is the freshness record; without it every scene reports
# as never-captured.
capture_manifest_path = "tests/scenes/images/capture-manifest.toml"

[image.tool]
command = "vhs"
args = ["{tape}"]
