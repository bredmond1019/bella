# celia.toml — bella's celia manifest, replacing scripts/vhs/scenes.toml.
#
# CE.1.D task 2: a TRANSLATION of scripts/vhs/scenes.toml, field by field.
# Every name, key sequence, dimension pair, settle override and min_bytes
# below is copied verbatim from that file — none of it is re-derived or
# "improved". Do not hand-tune a value here without re-deriving it from a
# verified-good capture the way scenes.toml's own comments describe.
#
# GAP FOUND AT TASK 2, FIXED AT TASK 3: celia's `Scene` had no per-scene
# override of `[target]` — `program`/`args`/`cwd` were one value for the
# whole manifest. bella's own scenes.toml drives the SAME binary at SIX
# distinct positional targets across these 19 scenes (`scripts/vhs/fixtures/
# demo.md`, `README.md`, `.`, `scripts/vhs/fixtures/reveal_demo`,
# `scripts/vhs/fixtures/symlink_demo/linked`,
# `scripts/vhs/fixtures/scroll_anchor.md`) — the same shape of gap task 1
# found and fixed for per-scene terminal dimensions (`width`/`height` on
# `Scene`). Task 3 added `Scene::args: Option<Vec<String>>` (same
# `Option<T>`-inherits-the-manifest-default shape) and
# `driver::resolved_target`, and every `[[scene]]` below now carries its
# own `args`, verbatim from that scene's `target =` line in scenes.toml —
# preserved as a `# target:` comment for traceability.
#
# SECOND GAP, ALSO FIXED AT TASK 3: the `narrow_scroll_anchor_after_resize`
# scene's last key is the literal `RESIZE:30x10` pseudo-key. bella's own
# `capture_scenes.sh` special-cased this token as a live `tmux
# resize-window` (never sent to the app) — the only way that manifest can
# exercise the real `Event::Resize` path bella's scroll anchoring reacts
# to. Task 3 added `driver::parse_resize_key` / `driver::resize_window_argv`
# and `TmuxDriver::run_scene` now dispatches on them instead of forwarding
# the token to `send_key_argv` as an (invalid) named key.
#
# ONE ENTRY DROPPED, NOT CARRIED VERBATIM (found running `celia check` at
# task 3): scripts/check_vhs_fresh.sh's SOURCE_FILES list names
# `crates/bella/src/theme.rs`, a path that has NEVER existed in bella's git
# history (`git log --all -- crates/bella/src/theme.rs` is empty) — a stale
# reference, presumably from before theme.rs moved into bella-engine.
# bella's own script tolerates this silently: its `commit_time_in_own_repo`
# returns "" for a path with no commit history and the `|| true` guard lets
# the freshness loop continue, so the phantom entry has never constrained
# anything. celia's `image::check_freshness` is deliberately stricter — a
# source with no commit history is a NAMED ERROR, never silently treated as
# "no constraint" (CE.1.C, already merged; not revisited here) — so
# carrying the phantom path verbatim would make `vhs-fresh` fail through
# celia where it always passed through the original script, which is a
# regression AC5 exists to catch, not a translation to preserve. Dropped
# below; the four real, existing source paths are unchanged.

golden_dir = "tests/scenes"

[target]
# program/cwd have no per-scene override — every scene drives the same
# release binary from the repo root, matching capture_scenes.sh's own
# `BINARY="$REPO_ROOT/target/release/bella"`. Each scene's positional
# argument is declared on that scene below via `args`.
program = "./target/release/bella"
args = []
cwd = "."

[settle]
# scenes.toml's [defaults] table, carried verbatim.
launch_settle = 2.0
key_settle = 0.4

