# BE.7.C task 3: reveal-toggle ('r') scenes. `reveal_demo/` is a fixture
# reproducing the fleet's real trap in miniature: a dot-directory
# (`.mev-history/`) containing a DIRECTORY named `status.md`, plus a
# `.gitignore`-ignored sibling (`ignored_notes/`) and a plain visible
# directory (`visible/`). With the toggle off, only `visible/` is listed;
# `r` reveals all three.
[[scene]]
name = "wide_browser_reveal_off"
target = "scripts/vhs/fixtures/reveal_demo"
keys = []
width = 110
height = 43
min_bytes = 25000

[[scene]]
name = "wide_browser_reveal_on"
target = "scripts/vhs/fixtures/reveal_demo"
keys = ["r"]
width = 110
height = 43
min_bytes = 25000

# A directory reached through a symlink — exercises `follow_links`
# resolving a symlinked root and listing its (real, non-empty) contents.
#
# This used to target the repo's own `planning` symlink, which resolves
# into the shared cross-repo HQ vault (`core/_planning/bella/`) — a LIVE
# directory that changes whenever any spec directory is created anywhere in
# bella's planning tree, including by the very SDLC task running this
# check. That made the golden baseline flaky by construction (count drifted
# 29 -> 30 mid-run from the running task's own scaffolding, BE.7.M).
# Repointed (BE.ticket.vhs-wait-for-readiness task 0) at a committed
# fixture — `scripts/vhs/fixtures/symlink_demo/linked` is a real symlink to
# `real_target/`, a small fixed directory — which exercises the same
# `follow_links` mechanism deterministically.
[[scene]]
name = "wide_browser_planning_symlink"
target = "scripts/vhs/fixtures/symlink_demo/linked"
keys = []
width = 110
height = 43
min_bytes = 25000

# TOC rail (BE.7.E task 3): rail-on and rail-off at a wide terminal — the
# frame/pane change this block ships. `t` toggles the rail; the rail's
# bordered pane is titled "Contents" (see `ui::draw_rail`), a text unique
# to the rail-visible state and used as the VHS readiness pattern for the
# "on" scene. There is no equally unique text for the "off" state — it is
# the ABSENCE of "Contents" — so the "off" scene (a second toggle back)
# relies on a settle Sleep after the toggle rather than a Wait+Screen
# match, the same way the existing quit sequences in this tape do (e.g.
# `Type "q"` followed by a plain `Sleep`, never a Wait).
[[scene]]
name = "wide_reader_rail_on"
target = "scripts/vhs/fixtures/demo.md"
keys = ["t"]
width = 110
height = 43
min_bytes = 90000

[[scene]]
name = "wide_reader_rail_off"
target = "scripts/vhs/fixtures/demo.md"
keys = ["t", "t"]
width = 110
height = 43
min_bytes = 130000

# --- Narrow (~65x27 cols) — wrap/reflow check -------------------------------

[[scene]]
name = "narrow_reader_demo_top"
target = "scripts/vhs/fixtures/demo.md"
keys = []
width = 65
height = 27
min_bytes = 75000

[[scene]]
name = "narrow_reader_demo_table"
target = "scripts/vhs/fixtures/demo.md"
keys = [
  "Down", "Down", "Down", "Down", "Down", "Down", "Down", "Down", "Down",
  "Down", "Down", "Down", "Down", "Down", "Down", "Down", "Down", "Down",
  "Down", "Down",
]
width = 65
height = 27
min_bytes = 25000

[[scene]]
name = "narrow_browser_root"
target = "."
keys = []
width = 65
height = 27
min_bytes = 19000

# TOC rail auto-collapse (BE.7.E task 3): a terminal narrower than
# `RAIL_WIDTH + MIN_BODY_WIDTH` (24 + 20 = 44 columns, see ui.rs) so
# toggling the rail on has NO visible effect — the minimum-body-width
# policy auto-collapses it rather than squeezing the body. Captured at a
# dedicated width (40 cols here, its own narrower VHS tape at
# scripts/vhs/reference-collapse.tape — neither reference-wide.tape nor
# reference-narrow.tape's fixed terminal size is narrow enough to cross
# the 44-column threshold). The readiness Wait matches the doc's H1 BEFORE
# the `t` keypress (there is nothing new to wait for afterward — that
# absence of change is exactly what this scene proves), then a settle
# Sleep covers the toggle itself.
[[scene]]
name = "narrow_reader_rail_collapse"
target = "scripts/vhs/fixtures/demo.md"
keys = ["t"]
width = 40
height = 27
min_bytes = 15000

# --- Scroll anchoring (BE.7.D task 3) --------------------------------------
#
# The two scenes below are a pair sharing one document, one scroll position,
# and one starting width (80x10) — a small viewport so the fixture actually
# overflows and there is something to scroll through. The first captures
# BEFORE any resize; the second scrolls to the identical position and then
# resizes live (via the `RESIZE:` pseudo-key, tmux tier only — see the
# `keys` field doc above) to width 30 before capturing. Diffing the two
# baselines under tests/scenes/ is the visual proof that BE.7.D's anchor
# keeps the same source line at the top of the viewport across the resize,
# not the seams spike's measured ~36% teleport a raw display-row index
# would produce.

[[scene]]
name = "wide_scroll_anchor_top"
target = "scripts/vhs/fixtures/scroll_anchor.md"
keys = ["Down", "Down", "Down", "Down"]
width = 80
height = 10
min_bytes = 200000

[[scene]]
name = "narrow_scroll_anchor_after_resize"
target = "scripts/vhs/fixtures/scroll_anchor.md"
keys = ["Down", "Down", "Down", "Down", "RESIZE:30x10"]
width = 80
height = 10
min_bytes = 150000
