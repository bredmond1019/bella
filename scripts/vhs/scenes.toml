# scenes.toml — the single scene manifest, read by both tiers:
#   - scripts/capture_scenes.sh / scripts/check_scenes.sh (text captures via
#     tmux against the real binary, diffed against tests/scenes/<name>.txt)
#   - scripts/vhs/reference-wide.tape / reference-narrow.tape (VHS PNGs,
#     freshness/sanity-gated by scripts/check_vhs_fresh.sh, never diffed)
#
# Adding a scene to one tier and not the other is meant to be detectable —
# BE.7.L task 5 adds a parity check to check_scenes.sh that fails when the
# scene names here and the tapes' `Screenshot` targets disagree.
#
# RULE (BE.ticket.vhs-wait-for-readiness task 0): a scene's `target` must be
# a committed fixture (under scripts/vhs/fixtures/) or another stable
# in-repo path (a tracked file like README.md, or the repo root `.`) —
# NEVER a shared vault path such as `planning/`, which is a symlink into
# the cross-repo HQ vault and mutates whenever ANY spec directory is
# created anywhere in the fleet, including by the SDLC task running this
# very check. The baseline captured for a scene is a golden file; a
# directory this repo does not control cannot back one. See the
# `wide_browser_planning_symlink` scene below for the fixture pattern that
# replaces a live-directory target while still exercising the same code
# path.
#
# Fields per [[scene]]:
#   name    — scene id; also the basename of tests/scenes/<name>.txt
#   target  — file or directory bella is opened on, repo-relative
#   keys    — ordered list of keystrokes sent one at a time via
#             `tmux send-keys`, never as a repeat-count (settle-time
#             regression guard — see [defaults].key_settle below and
#             carryover `rapid-keypresses-blank-the-render`). Each entry is
#             either a literal single character/string (sent with `-l`) or
#             one of tmux's named keys: Down, Up, Enter, Escape, Tab, BTab,
#             PPage, NPage, Home, End. A `RESIZE:<cols>x<rows>` entry (BE.7.D
#             task 3) is a pseudo-key handled by capture_scenes.sh itself —
#             not sent to the app — that live-resizes the tmux window via
#             `tmux resize-window`, the only way this manifest can exercise
#             the real `Event::Resize` path scroll anchoring reacts to. The
#             VHS tapes cannot reproduce a live mid-capture resize (`Set
#             Width`/`Set Height` mid-tape is silently ignored by VHS), so a
#             `RESIZE`-using scene's `Screenshot` counterpart there is a
#             fresh launch already at the post-resize size, not a real
#             resize — the tmux/text capture is the one tier that actually
#             exercises the resize path for this scene.
#   width   — pinned terminal columns
#   height  — pinned terminal rows
#   settle  — optional override (seconds) of [defaults].key_settle for this
#             scene only, for a scene that needs a longer render pause. This
#             is the tmux-tier knob only — the VHS tier's post-keystroke
#             `Sleep` durations live in the tapes themselves, and were
#             widened there in BE.7.D task3's fix pass (wide_browser_nested,
#             wide_browser_reveal_on, both scroll-anchor scenes) after those
#             scenes intermittently landed as blank 4622-byte captures under
#             concurrent-lane CPU contention — see reference-wide.tape /
#             reference-narrow.tape for the per-scene values.
#   min_bytes — expected minimum PNG size (bytes) for this scene's VHS
#             capture, read by scripts/check_vhs_fresh.sh as the per-scene
#             sanity floor. Derived from a verified-good capture and set
#             generously under it, but well above a blank frame (blanks at
#             these terminal sizes land around 2-20KB) — a single global
#             floor cannot discriminate a blank from a real capture across
#             scenes this different in size (see check_vhs_fresh.sh).

[defaults]
# Time to wait after launching the binary before the first keystroke/capture,
# so the initial render (and any cargo/file-load work) has settled.
launch_settle = 2.0
# Time to wait after EACH individual keystroke before sending the next one.
# Sending keys with an explicit sleep between them (never a repeat-count) is
# load-bearing: BE.7.B task 3 reproducibly blanked a VHS capture with
# `Down 34`/`Down 38` while single stepped `Down` was stable across three
# runs. See carryover `rapid-keypresses-blank-the-render`.
key_settle = 0.4

# --- Wide (~110x43 cols) ---------------------------------------------------

[[scene]]
name = "wide_reader_demo_top"
target = "scripts/vhs/fixtures/demo.md"
keys = []
width = 110
height = 43
min_bytes = 130000

[[scene]]
name = "wide_reader_demo_tasks_code"
target = "scripts/vhs/fixtures/demo.md"
keys = [
  "Down", "Down", "Down", "Down", "Down", "Down", "Down", "Down", "Down",
  "Down", "Down", "Down", "Down", "Down", "Down", "Down", "Down", "Down",
]
width = 110
height = 43
min_bytes = 150000

[[scene]]
name = "wide_reader_demo_table"
target = "scripts/vhs/fixtures/demo.md"
keys = [
  "Down", "Down", "Down", "Down", "Down", "Down", "Down", "Down", "Down",
  "Down", "Down", "Down", "Down", "Down", "Down", "Down", "Down", "Down",
  "Down", "Down", "Down", "Down", "Down", "Down", "Down", "Down", "Down",
  "Down", "Down", "Down", "Down", "Down",
]
width = 110
height = 43
min_bytes = 140000

[[scene]]
name = "wide_reader_search"
target = "scripts/vhs/fixtures/demo.md"
