[package]
name = "bella"
version = "0.1.0"
edition = "2024"
description = "Beautiful terminal markdown viewer — local-only, no cloud"

[[bin]]
name = "bella"
path = "src/main.rs"

[dependencies]
bella-engine = { path = "../bella-engine" }
ratatui = "0.30"
crossterm = "0.29"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
open = "5"
